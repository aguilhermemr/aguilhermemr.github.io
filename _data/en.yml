about: "Systems Engineer with a postgraduate specialization in AI and hands-on experience supporting international clients by phone, chat and email. Applies Python and machine learning to business process optimization, backed by Cisco CCNA training. Trilingual and adaptable, having moved from Bolivia to Brazil to specialize in AI."
languages: "Languages: Spanish (native) · English (fluent) · Portuguese (fluent)"

