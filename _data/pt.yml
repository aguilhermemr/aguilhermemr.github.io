timeline:
  - kind: edu
    title: Pós-graduação lato sensu em Inteligência Artificial
    org: Senac, São Paulo – SP
    dates: 02/2025 – 07/2026
    details:
      - "TCC: otimização de workflows empresariais com machine learning (Reinforcement Learning e Graph Neural Networks) aplicada a BPM."
  - kind: course
    title: Formação Cisco CCNA v7.0 e Cisco Network Defense
    org: Senac e Cisco, São Paulo – SP
    dates: 2023 – 2026
    details:
      - Três cursos CCNA concluídos com credenciais verificadas no Credly; exame de certificação em preparação.
      - "Cisco Network Defense: credencial verificada (2025)."
  - kind: job
    title: Representante de suporte técnico e atendimento ao cliente
    org: Callnovo, La Paz, Bolívia
    dates: 09/2020 – 05/2022
    details:
      - Prestei suporte em inglês a clientes da RedPocket Mobile (operadora dos EUA) e da Tenvis (câmeras IP) por telefone, chat e e-mail.
      - Solucionei problemas de telefonia móvel e câmeras inteligentes, escalando casos complexos com documentação completa.
      - Registrei e acompanhei cada caso no CRM até a resolução.
  - kind: edu
    title: Bacharelado em Engenharia de Sistemas
    org: Universidad Católica Boliviana, La Paz, Bolívia
    dates: 2011 – 2019
    details:
      - "Administração de Empresas na mesma universidade: 95% da grade curricular concluída."
  - kind: job
    title: Atendimento ao cliente e suporte pós-venda
    org: Level Store, La Paz, Bolívia
    dates: 10/2018 – 06/2019
    details:
      - Realizei atendimento presencial e suporte pós-venda, diagnosticando e solucionando falhas em produtos.
      - Gerenciei o relacionamento e a coordenação com fornecedores.
  - kind: job
    title: Estagiário de suporte de sistemas
    org: DM Hoteles S.A., La Paz, Bolívia
    dates: 03/2015 – 08/2015
    details:
      - Apoiei a migração do ERP anterior para o SAP Business One, auxiliando os usuários nos processos de estoque e almoxarifado.
      - Gerenciei as redes sociais da empresa.

