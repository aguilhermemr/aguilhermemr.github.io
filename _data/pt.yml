about: "Formado em Engenharia de Sistemas, com pós-graduação em Inteligência Artificial e experiência em suporte técnico a clientes internacionais por telefone, chat e e-mail. Aplico Python e machine learning à otimização de processos de negócio e possuo formação em redes Cisco CCNA. Sou trilíngue (português, espanhol e inglês) e adaptável: mudei da Bolívia para o Brasil para me especializar em IA."
languages: "Idiomas: espanhol nativo · inglês fluente · português fluente"

