about: "Ingeniero de Sistemas con posgrado en Inteligencia Artificial y experiencia en soporte técnico a clientes internacionales por teléfono, chat y correo electrónico. Aplico Python y machine learning a la optimización de procesos de negocio y cuento con formación en redes Cisco CCNA. Soy trilingüe y adaptable: me trasladé de Bolivia a Brasil para especializarme en IA."
languages: "Idiomas: español nativo · inglés fluido · portugués fluido"

