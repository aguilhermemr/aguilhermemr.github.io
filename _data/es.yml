timeline:
  - kind: edu
    title: Especialización en Inteligencia Artificial (posgrado)
    org: Senac, São Paulo, Brasil
    dates: feb. 2025 – jul. 2026
    details:
      - "Tesis: optimización de flujos de trabajo empresariales con machine learning (Reinforcement Learning y Graph Neural Networks) aplicada a BPM."
  - kind: course
    title: Formación Cisco CCNA v7.0 y Cisco Network Defense
    org: Senac y Cisco, São Paulo, Brasil
    dates: 2023 – 2026
    details:
      - "Cisco CCNA v7.0: los 3 cursos completados con insignias verificadas; examen de certificación en preparación."
      - Cisco Network Defense, credencial verificada (2025).
  - kind: job
    title: Representante de soporte técnico y atención al cliente
    org: Callnovo, La Paz, Bolivia
    dates: sep. 2020 – may. 2022
    details:
      - Brindé soporte en inglés a clientes de RedPocket Mobile (operador móvil de EE. UU.) y Tenvis (cámaras IP) por teléfono, chat y correo.
      - Resolví incidencias de telefonía móvil y cámaras inteligentes, escalando los casos complejos con documentación completa.
      - Registré cada caso en el CRM y le di seguimiento hasta su resolución.
  - kind: edu
    title: Ingeniería de Sistemas (titulado)
    org: Universidad Católica Boliviana, La Paz, Bolivia
    dates: 2011 – 2019
    details:
      - "Proyecto de grado: automatización de la contratación de personal con BPM y lógica difusa (nota 85, con mención de honor)."
      - "Administración de Empresas en la misma universidad: 95% del plan de estudios aprobado."
  - kind: job
    title: Atención al cliente y soporte posventa
    org: Level Store, La Paz, Bolivia
    dates: oct. 2018 – jun. 2019
    details:
      - Brindé atención al cliente en tienda y soporte posventa, diagnosticando y resolviendo fallas de productos.
      - Gestioné la relación y la coordinación con proveedores.
  - kind: job
    title: Pasante de soporte de sistemas
    org: DM Hoteles S.A., La Paz, Bolivia
    dates: mar. 2015 – ago. 2015
    details:
      - Apoyé la migración del ERP anterior a SAP Business One, asistiendo a los usuarios en los procesos de inventario y almacén.
      - Administré las redes sociales de la empresa.

