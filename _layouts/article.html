{%- assign t = site.data[page.lang] -%}
<!doctype html>
<html lang="{{ t.html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | Angel Guillermo Morales Romero</title>
<meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}{{ t.meta.description }}{% endif %}">
<meta name="author" content="{{ site.author }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ site.photo }}">
<meta name="theme-color" content="#10294A">
<link rel="icon" href="{{ site.baseurl }}{{ site.photo_small }}">
<script>
(function(){var d=document.documentElement,s=null;try{s=localStorage.getItem('theme')}catch(e){}
if(!s){s=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}d.setAttribute('data-theme',s);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="{{ site.baseurl }}{{ t.path }}">Angel Morales Romero</a>
    <div class="tools">
      <button class="icon-btn theme-btn" type="button" aria-label="{{ t.ui.theme_label }}">
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap article">
  <p><a class="link" href="{{ site.baseurl }}{{ t.path }}#artigos">{{ t.back }}</a></p>
  <h1>{{ page.title }}</h1>
  <p class="muted small">{{ page.date | date: "%d/%m/%Y" }} · Angel Guillermo Morales Romero</p>
  <div class="prose">
{{ content }}
  </div>
</main>
<footer class="foot">© Angel Guillermo Morales Romero · {{ t.footer }}</footer>
<script src="{{ site.baseurl }}/assets/js/site.js" defer></script>
</body>
</html>
